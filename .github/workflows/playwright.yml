name: Playwright Tests
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

env:
  LINK: "http://localhost:8085"
  TEST_PASS: TestPassword
  PUBLIC_POLL_VERSION: 2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          outputs: type=docker,dest=/tmp/flowback-frontend.tar
          tags: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}/flowback-frontend:latest

      - uses: actions/upload-artifact@v4
        with:
          name: flowback-frontend-image
          path: /tmp/flowback-frontend.tar
          retention-days: 1

  frontend-tests:
    needs: build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      LINK: http://localhost:8085
      TEST_PASS: TestPassword
    steps:
      - name: Checkout flowback-docker
        uses: actions/checkout@v4
        with:
          repository: Kattenelvis/flowback-docker
          path: flowback-docker

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: Kattenelvis/flowback-backend
          path: flowback-backend
          ref: ${{ (github.ref == 'refs/heads/dev' || github.base_ref == 'dev' || github.head_ref == 'dev') && 'development' || 'master' }}

      - uses: actions/download-artifact@v4
        with:
          name: flowback-frontend-image

      - name: Load frontend image
        run: docker load --input flowback-frontend.tar

      - name: Tag frontend image for Compose services
        run: docker tag "${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}/flowback-frontend:latest" flowback-docker-flowback-frontend:latest

      - name: Build images
        working-directory: flowback-docker
        run: docker compose build caddy flowback-backend flowback-celery-worker flowback-celery-beat

      - name: Start Flowback stack
        working-directory: flowback-docker
        run: docker compose up -d --no-build --pull missing
      
      - uses: actions/checkout@v4
        with:
          repository: Kattenelvis/flowback-interface-testing
          path: flowback-interface-testing

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: flowback-interface-testing
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: flowback-interface-testing
        run: npx playwright install --with-deps chromium

      - name: Verify interface test configuration
        working-directory: flowback-interface-testing
        run: test -n "$TEST_PASS"

      - name: Run Smoke tests (basic login functionality)
        working-directory: flowback-interface-testing
        run: npx playwright test -g "Smoke-Test" --project chromium --retries 1
          --workers 1

      - name: Run the rest of the tests
        working-directory: flowback-interface-testing
        run: npx playwright test . --project chromium --retries 2 --workers 1 --reporter list
          --grep-invert "Smoke-Test"

      - name: Dump docker logs on failure
        if: ${{ failure() }}
        working-directory: flowback-docker
        run: docker compose logs

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: flowback-interface-testing/playwright-report/
          retention-days: 30

  docker-publish:
    needs: frontend-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flowback-frontend-image

      - name: Load frontend image
        run: docker load --input flowback-frontend.tar

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish frontend image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/flowback-frontend:latest

  publish-dev:
    needs: docker-publish
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            cd flowback/flowback-docker-testing
            docker compose pull && docker compose up -d

  # Production publishes only from development or master pushes.
  publish-prod:
    needs: publish-dev
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/master') }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            cd flowback/flowback-docker-prod
            docker compose pull && docker compose up -d
