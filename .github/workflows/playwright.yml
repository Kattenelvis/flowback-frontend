name: Playwright Tests
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flowback-frontend:latest

  publish:
    needs: build
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            cd flowback/flowback-docker
            docker compose pull && docker compose up -d

  testing:
    needs: publish
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Kattenelvis/flowback-interface-testing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        # run: npx playwright test --project chromium --retries 1 --workers 1
        run: npx playwright test --project chromium --retries 1 --workers 1 g Smoke-Test
        env:
          LINK: ${{ secrets.LINK }}
          TEST_PASS: ${{ secrets.TEST_PASS }}
          MAINUSER_PASS: "a"
          MAINUSER_MAIL: "a@a.se"
          MAINUSER_NAME: "a"
          SECONDUSER_PASS: "b"
          SECONDUSER_MAIL: "b@b.se"
          SECONDUSER_NAME: "b"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
