name: Playwright Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  LINK: 'http://localhost:8085'
  TEST_PASS: TestPassword
  PUBLIC_POLL_VERSION: 2
  # Only two published tags: pushes to master -> :latest (which prod pulls),
  # pull requests from dev -> :dev
  FRONTEND_TAG: ${{ github.event_name == 'push' && 'latest' || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          outputs: type=docker,dest=/tmp/flowback-frontend.tar
          tags: flowback-frontend:ci

      - uses: actions/upload-artifact@v4
        with:
          name: flowback-frontend-image
          path: /tmp/flowback-frontend.tar
          retention-days: 1

  frontend-tests:
    needs: build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      LINK: http://localhost:8085
      TEST_PASS: TestPassword
    steps:
      - name: Checkout flowback-docker
        uses: actions/checkout@v4
        with:
          repository: Kattenelvis/flowback-docker
          path: flowback-docker

      # Test against the backend and interface-testing branches with the same name
      # (e.g. dev) so paired changes are tested together; otherwise use master
      - name: Pick branches
        id: refs
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for repo in flowback-backend flowback-interface-testing; do
            ref=master
            if git ls-remote --exit-code --heads "https://github.com/Kattenelvis/$repo" "$BRANCH" > /dev/null; then
              ref=$BRANCH
            fi
            echo "$repo=$ref" >> "$GITHUB_OUTPUT"
          done

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: Kattenelvis/flowback-backend
          path: flowback-backend
          ref: ${{ steps.refs.outputs.flowback-backend }}

      - uses: actions/download-artifact@v4
        with:
          name: flowback-frontend-image

      - name: Load frontend image
        run: docker load --input flowback-frontend.tar

      # Tag the CI image with the name flowback-docker's compose file expects,
      # so the stack runs this commit's frontend
      - name: Tag frontend image for Compose services
        working-directory: flowback-docker
        run: docker tag flowback-frontend:ci "$(docker compose config --images | grep flowback-frontend)"

      # The Celery services share the backend's image, so building it covers them
      - name: Build images
        working-directory: flowback-docker
        run: docker compose build flowback-backend

      - name: Pull published images
        working-directory: flowback-docker
        run: docker compose pull flowback-postgresql flowback-redis caddy

      # --pull never: fail instead of silently falling back to a published image
      - name: Start Flowback stack
        working-directory: flowback-docker
        run: docker compose up -d --no-build --pull never

      - uses: actions/checkout@v4
        with:
          repository: Kattenelvis/flowback-interface-testing
          path: flowback-interface-testing
          ref: ${{ steps.refs.outputs.flowback-interface-testing }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: flowback-interface-testing
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: flowback-interface-testing
        run: npx playwright install --with-deps chromium

      - name: Verify interface test configuration
        working-directory: flowback-interface-testing
        run: test -n "$TEST_PASS"

      - name: Run Smoke tests (basic login functionality)
        working-directory: flowback-interface-testing
        run: npx playwright test -g "Smoke-Test" --project chromium --retries 1
          --workers 1

      - name: Run the rest of the tests
        working-directory: flowback-interface-testing
        run:
          npx playwright test . --project chromium --retries 2 --workers 2 --reporter list --max-failures=4
          --grep-invert "Smoke-Test|missing-requirements"

      - name: Dump docker logs on failure
        if: ${{ failure() }}
        working-directory: flowback-docker
        run: docker compose logs

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: flowback-interface-testing/playwright-report/
          retention-days: 30

  docker-publish:
    needs: frontend-tests
    # Publish from master pushes and from PRs from dev; other PRs are only tested.
    # Fork PRs get no secrets, so skip publishing instead of failing
    if: github.event_name == 'push' || (github.head_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flowback-frontend-image

      - name: Load frontend image
        run: docker load --input flowback-frontend.tar

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish frontend image
        run: |
          docker tag flowback-frontend:ci ${{ secrets.DOCKERHUB_USERNAME }}/flowback-frontend:$FRONTEND_TAG
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/flowback-frontend:$FRONTEND_TAG

  publish-dev:
    needs: docker-publish
    # The dev server runs the :dev image published from PRs from dev
    if: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            cd /home/flowback/dev-flowback
            export FRONTEND_TAG=dev BACKEND_TAG=dev
            docker compose up -d --pull always

  # Production publishes only from master pushes.
  publish-prod:
    needs: docker-publish
    if: ${{ github.event_name == 'push' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            cd /home/flowback/prod-flowback
            docker compose up -d --pull always
